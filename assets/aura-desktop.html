<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZAOD Desktop</title>
<style>
:root{--bg:#dce8f7;--ink:#172033;--muted:#69758a;--glass:rgba(248,251,255,.82);--blue:#4b82ff;--line:rgba(23,32,51,.10);--shadow:0 18px 50px rgba(42,62,96,.18)}
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;font-family:"Segoe UI",Inter,sans-serif;color:var(--ink);background:#bcd2eb}button,input{font:inherit}.desktop{position:fixed;inset:0;background:linear-gradient(180deg,#cfddeb 0%,#eff5fa 100%)}
.wallpaper{position:absolute;inset:0;background:radial-gradient(circle at 72% 56%,rgba(255,255,255,.9),transparent 18%),linear-gradient(155deg,#c8dcf4 0,#edf5fb 64%,#dfeaf4 100%)}.hill{position:absolute;bottom:-18%;width:88%;height:45%;border-radius:50%;background:linear-gradient(140deg,#dce8f7,#839fc4);filter:blur(.2px)}.hill.one{left:-34%}.hill.two{right:-38%;bottom:-24%;height:52%}
.app-grid{position:absolute;top:3%;left:3.5%;display:grid;grid-template-columns:repeat(5,92px);gap:18px 14px}.app{border:0;background:transparent;color:var(--ink);width:92px;height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;border-radius:18px;cursor:pointer}.app:hover{background:rgba(255,255,255,.52)}.icon{width:50px;height:50px;border-radius:15px;background:linear-gradient(145deg,#fff,#dce8f7);box-shadow:0 8px 18px rgba(56,76,110,.14);display:grid;place-items:center;font-size:23px}.app-label{font-size:12px;text-align:center;line-height:14px}
.shelf{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);height:68px;min-width:min(620px,92vw);padding:8px 12px;border:1px solid rgba(255,255,255,.72);border-radius:22px;background:var(--glass);box-shadow:var(--shadow);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:center;gap:8px}.shelf-btn{width:52px;height:52px;border:0;border-radius:16px;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink)}.shelf-btn:hover{background:rgba(75,130,255,.11)}.shelf-btn.primary{background:linear-gradient(145deg,#5c90ff,#3867e9);color:white}.shelf-spacer{width:20px}.status{position:absolute;right:18px;top:14px;height:38px;border:1px solid rgba(255,255,255,.8);border-radius:18px;background:var(--glass);box-shadow:0 8px 24px rgba(50,70,100,.12);display:flex;align-items:center;gap:12px;padding:0 12px;font-size:12px}.status button{border:0;background:transparent;cursor:pointer;color:var(--ink)}
.drawer{position:absolute;left:50%;bottom:90px;transform:translate(-50%,18px) scale(.98);width:min(720px,calc(100vw - 32px));max-height:min(620px,calc(100vh - 120px));overflow:auto;border:1px solid rgba(255,255,255,.8);border-radius:24px;background:rgba(248,251,255,.94);box-shadow:var(--shadow);backdrop-filter:blur(22px);padding:20px;opacity:0;pointer-events:none;transition:.18s}.drawer.open{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}.drawer-head{display:flex;align-items:center;gap:12px}.search{flex:1;height:44px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:white;outline:none}.close{border:0;background:#edf2f8;width:36px;height:36px;border-radius:12px;cursor:pointer}.drawer-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:18px}.drawer .app{width:auto;height:96px}.drawer-app .icon{background:white}
.quick{left:auto;right:18px;transform:translateY(18px) scale(.98);width:350px}.quick.open{transform:translateY(0) scale(1)}.quick-card{display:flex;align-items:center;justify-content:space-between;padding:14px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.72);margin-top:10px}.toggle{width:46px;height:26px;border-radius:20px;border:0;background:#ccd6e5;position:relative}.toggle:after{content:"";position:absolute;width:20px;height:20px;top:3px;left:3px;border-radius:50%;background:white;transition:.15s}.toggle.on{background:#4b82ff}.toggle.on:after{left:23px}.quick-range{width:100%;accent-color:#4b82ff}
.oobe{position:fixed;z-index:50;inset:0;background:linear-gradient(135deg,#edf4fb,#c9dcf4);display:flex;align-items:center;justify-content:center}.oobe.hidden{display:none}.oobe-card{width:min(520px,calc(100vw - 32px));background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.9);border-radius:24px;box-shadow:var(--shadow);padding:32px}.oobe h1{margin:8px 0;font-size:30px}.oobe p{color:var(--muted);line-height:1.5}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:700}.field input{height:44px;border:1px solid #ccd7e4;border-radius:12px;padding:0 12px;outline:none}.field input:focus{border-color:#4b82ff}.primary{width:100%;height:46px;border:0;border-radius:12px;background:#4b82ff;color:white;font-weight:700;cursor:pointer}.oobe-actions{display:flex;gap:10px}.secondary{height:46px;border:1px solid #ccd7e4;border-radius:12px;background:white;color:var(--ink);padding:0 14px}.msg{min-height:20px;color:#b43c54;font-size:12px}.success{color:#16805a}
@media(max-width:760px){.app-grid{grid-template-columns:repeat(4,82px);gap:12px 6px}.drawer-grid{grid-template-columns:repeat(4,1fr)}.shelf{min-width:calc(100vw - 20px)}}
</style>
</head>
<body>
<div class="desktop" id="desktop">
 <div class="wallpaper"><div class="hill one"></div><div class="hill two"></div></div>
 <div class="app-grid" id="desktopGrid"></div>
 <div class="status"><button id="wifiStatus">Wi-Fi</button><button id="quickButton">&#9881; <span id="clock">--:--</span></button></div>
 <div class="shelf">
  <button class="shelf-btn primary" id="appsButton" title="All apps">&#9638;</button><div class="shelf-spacer"></div>
  <div id="pinnedShelf"></div>
 </div>
 <section class="drawer" id="appDrawer"><div class="drawer-head"><input id="appSearch" class="search" placeholder="Search apps"><button class="close" id="closeDrawer">&#10005;</button></div><div class="drawer-grid" id="drawerGrid"></div></section>
 <section class="drawer quick" id="quick"><div class="drawer-head"><b>Quick settings</b><button class="close" id="closeQuick">&#10005;</button></div><div class="quick-card"><div><b>Wi-Fi</b><br><small>Wireless</small></div><button class="toggle on" id="wifiToggle"></button></div><div class="quick-card"><div><b>Bluetooth</b><br><small>Off</small></div><button class="toggle" id="btToggle"></button></div><label class="quick-card"><b>Brightness</b><input id="bright" class="quick-range" type="range" min="20" max="100" value="100"></label><label class="quick-card"><b>Volume</b><input id="volume" class="quick-range" type="range" min="0" max="100" value="70"></label></section>
</div>
<section class="oobe" id="oobe"><div class="oobe-card"><b>ZAOD OS</b><h1>Welcome. Create your account.</h1><p>Your files and apps stay private to this account. On live media, account data remains only for this boot unless USB persistence is enabled.</p><div class="field"><label>Full name</label><input id="fullName" autocomplete="name"></div><div class="field"><label>Username</label><input id="username" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="new-password"></div><div class="field"><label>Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password"></div><div class="msg" id="oobeMsg"></div><button class="primary" id="createAccount">Create account</button></div></section>
<script>
const apps=[
{id:'browser',name:'Browser',icon:'&#9875;',launch:'browser'},
{id:'files',name:'Files',icon:'&#128193;',launch:'thunar'},
{id:'store',name:'App Store',icon:'&#9654;',launch:'store'},
{id:'terminal',name:'Terminal',icon:'&#9655;',launch:'terminal'},
{id:'camera',name:'Camera',icon:'&#9673;',launch:'camera'},
{id:'notes',name:'Notes',icon:'&#9998;',launch:'notes'},
{id:'settings',name:'Settings',icon:'&#9881;',launch:'settings'},
{id:'usb',name:'USB Tool',icon:'&#9000;',launch:'usb'},
{id:'studio',name:'ZAOD Studio',icon:'&#9883;',launch:'studio'},
{id:'gallery',name:'Gallery',icon:'&#9635;',launch:'gallery'}
];
const desktopGrid=document.querySelector('#desktopGrid'),pinnedShelf=document.querySelector('#pinnedShelf'),drawerGrid=document.querySelector('#drawerGrid');
function renderApp(container,app,pinned=false){const b=document.createElement('button');b.className=pinned?'shelf-btn':'app';b.innerHTML=(pinned?'':`<span class="icon">${app.icon}</span>`)+`<span class="app-label">${pinned?'':app.name}</span>`;if(pinned)b.innerHTML=`<span class="icon">${app.icon}</span>`;b.onclick=()=>launch(app.launch);container.appendChild(b)}
apps.slice(0,6).forEach(a=>renderApp(desktopGrid,a));apps.slice(0,5).forEach(a=>renderApp(pinnedShelf,a,true));
function renderDrawer(q=''){drawerGrid.innerHTML='';apps.filter(a=>a.name.toLowerCase().includes(q.toLowerCase())).forEach(a=>renderApp(drawerGrid,a))}
function launch(name){fetch('/api/launch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({app:name})}).catch(()=>{})}
renderDrawer();document.querySelector('#appsButton').onclick=()=>{drawerGrid.classList.toggle('open');document.querySelector('#appDrawer').classList.toggle('open')};document.querySelector('#appSearch').oninput=e=>renderDrawer(e.target.value);document.querySelector('#closeDrawer').onclick=()=>document.querySelector('#appDrawer').classList.remove('open');document.querySelector('#quickButton').onclick=()=>document.querySelector('#quick').classList.toggle('open');document.querySelector('#closeQuick').onclick=()=>document.querySelector('#quick').classList.remove('open');
document.querySelector('#wifiToggle').onclick=e=>e.target.classList.toggle('on');document.querySelector('#btToggle').onclick=e=>e.target.classList.toggle('on');document.querySelector('#bright').oninput=e=>document.body.style.filter=`brightness(${e.target.value}%)`;document.querySelector('#volume').oninput=e=>{};
function clock(){document.querySelector('#clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}clock();setInterval(clock,1000);
fetch('/api/status').then(r=>r.json()).then(s=>{if(s.onboarded)document.querySelector('#oobe').classList.add('hidden')}).catch(()=>{});
const full=document.querySelector('#fullName'),user=document.querySelector('#username');full.oninput=()=>{if(!user.dataset.edited)user.value=full.value.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')};user.oninput=()=>user.dataset.edited='1';
document.querySelector('#createAccount').onclick=async()=>{const p=document.querySelector('#password').value,c=document.querySelector('#confirmPassword').value,u=user.value.trim();const msg=document.querySelector('#oobeMsg');if(!full.value.trim()){msg.textContent='Enter your full name.';return}if(!/^[a-z][a-z0-9-]{0,31}$/.test(u)){msg.textContent='Enter a valid lowercase username.';return}if(p.length<8){msg.textContent='Password must contain at least 8 characters.';return}if(p!==c){msg.textContent='Passwords do not match.';return}msg.textContent='Creating account...';const r=await fetch('/api/onboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fullName:full.value.trim(),username:u,password:p})});const j=await r.json();if(j.ok){msg.className='msg success';msg.textContent='Account created. Please sign in with your new account.';document.querySelector('#createAccount').textContent='Ready — Sign out';document.querySelector('#createAccount').onclick=()=>launch('logout')}else msg.textContent=j.error||'Account setup failed.'};
</script>
</body></html>
